<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Zwiftワークアウトタイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Noto+Sans+JP:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen trainer console — target watts + live watts on top, countdown, workout profile strip, controls below. Single dark look for indoor riding. */
:root{
  --bg:#0f1214; --panel:#181d20; --line:#2a3236; --fg:#eef2f1; --muted:#8a9a9c; --accent:#f5c518;
  --z1:#7d8a8f; --z2:#3b8fe0; --z3:#3fbf6a; --z4:#f5c518; --z5:#f08a24; --z6:#e5484d;
  --ok:#3fbf6a; --low:#3b8fe0; --high:#e5484d;
  --num:"Big Shoulders Display","Oswald",Impact,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px}
.app{max-width:560px;margin:0 auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;padding:4px 0;color:var(--fg);text-align:left;min-width:0;flex:1}
.wname{font-family:var(--num);font-weight:800;font-size:26px;letter-spacing:.02em;line-height:1;overflow-wrap:anywhere}
.wmeta{font-size:12px;color:var(--accent);font-weight:600}
.picker{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));gap:10px;max-width:560px;margin:0 auto;box-sizing:border-box}
.detail{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.dtback{align-self:flex-start;padding:8px 12px;font-size:13px}
.detail h2{font-family:var(--num);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:.02em;overflow-wrap:anywhere;text-wrap:balance}
.dtmeta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dtmeta b{font-family:var(--num);font-size:24px;color:var(--fg);font-weight:600;margin-right:3px}
.dtprof{height:110px;display:flex;align-items:flex-end;background:var(--panel);border-radius:10px;padding:10px 10px 0}
.dtprof i{display:block;flex-shrink:0}
.dtsec h3{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 8px;font-weight:600}
.zbars{display:grid;gap:5px}
.zrow{display:grid;grid-template-columns:118px 1fr 52px;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums}
.zrow .zt{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.zrow .zt i{display:block;height:100%}
.zrow span:last-child{text-align:right;color:var(--muted)}
.dtsum{margin:0;line-height:1.8;font-size:14px;max-width:65ch}
.dtsteps{margin:0;padding-left:22px;display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums;line-height:1.5}
.dtsteps li::marker{color:var(--muted)}
.dtsteps .rep{color:var(--accent);font-weight:700}
.dtlink{color:var(--accent);font-weight:600;font-size:14px}
.dtgo{position:sticky;bottom:0;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.dtgo button{width:100%}
.picker{position:fixed}
.pkhead{display:flex;gap:8px}
.pkhead input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:12px;font-size:16px;font-family:var(--body)}
.pkhead button{padding:10px 14px;font-size:14px}
.pkfilter{display:flex;gap:6px;flex-wrap:wrap}
.pkfilter button{padding:8px 12px;font-size:13px;border-radius:999px}
.pkfilter button.on{background:var(--accent);border-color:var(--accent);color:#141414}
.pkcount{font-size:12px;color:var(--muted)}
.pklist{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px}
.pklist li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px}
.pklist li button.cur{border-color:var(--accent)}
.pkn{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.pkm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{grid-column:1/-1;display:flex;align-items:flex-end;height:22px;gap:0}
.mini i{display:block;flex-shrink:0;opacity:.85}
header h1{font-family:var(--num);font-weight:800;font-size:26px;letter-spacing:.02em;margin:0}
header h1 small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.ftp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.08em}
.ftp input{width:64px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 8px;font-family:var(--num);font-size:20px;text-align:center}
.now{background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--zc,var(--z1));transition:border-color .3s}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label b{font-size:16px}
.label span{font-size:12px;color:var(--muted);letter-spacing:.08em}
.pw{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.pw > div{min-width:0}
.cap{font-size:11px;color:var(--muted);letter-spacing:.12em}
.watts{font-family:var(--num);font-weight:800;font-size:clamp(64px,19vw,104px);line-height:.9;font-variant-numeric:tabular-nums}
.watts small{font-size:.32em;color:var(--muted);margin-left:4px}
#watts{color:var(--zc,var(--fg))}
.live{color:var(--muted)}
.live.ok{color:var(--ok)} .live.low{color:var(--low)} .live.high{color:var(--high)}
.laps{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.laps > div{display:flex;align-items:baseline;gap:6px;min-width:0;flex-wrap:wrap}
.laps b{font-family:var(--num);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.laps small{color:var(--muted);font-size:12px}
.laps .cap{width:100%}
.laps b.ok{color:var(--ok)} .laps b.low{color:var(--low)} .laps b.high{color:var(--high)}
.prevTgt{font-size:12px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.clock{font-family:var(--num);font-weight:600;font-size:clamp(52px,16vw,80px);line-height:1;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--zc,var(--fg))}
.next{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:0 2px}
.next b{color:var(--fg);font-weight:600}
.bt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bt button{padding:10px 14px;font-size:14px}
.dev{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
.dev button{min-width:200px}
.alls{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;width:100%;font-size:12px}
.bt button.link{background:none;border:0;padding:4px 0;color:var(--accent);text-decoration:underline;font-weight:600;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block;margin-right:6px}
.dot.on{background:var(--ok)}
.erg{display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px}
.erg button{padding:10px 12px;font-size:14px;background:var(--bg)}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button.on{background:var(--ok);border-color:var(--ok);color:#0f1214}
.ergrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ergadj{display:flex;align-items:center;gap:6px}
.ergadj button{font-size:20px;width:52px;padding:8px 0}
.ergadj span{font-family:var(--num);font-size:26px;min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.ergnow{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.msg{font-size:12px;color:var(--muted);line-height:1.6;background:var(--panel);border-radius:8px;padding:10px 12px}
.profile{position:relative;height:84px;display:flex;align-items:flex-end;gap:1px;background:var(--panel);border-radius:10px;padding:8px 8px 0;overflow:hidden}
.profile div.seg{flex-shrink:0;border-radius:2px 2px 0 0;opacity:.45}
.profile div.done{opacity:.2}
.profile div.cur{opacity:1}
.cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);left:8px}
.total{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.total b{font-family:var(--num);font-size:20px;color:var(--fg);font-weight:600}
.controls{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;margin-top:auto}
button{font-family:var(--body);font-weight:700;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:16px 8px;cursor:pointer}
button.go{background:var(--accent);color:#141414;border-color:var(--accent);font-size:18px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.list summary{cursor:pointer;color:var(--fg)}
.list ol{margin:8px 0 0;padding-left:20px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.list li.cur{color:var(--accent)}
.done-msg{text-align:center;font-size:18px;font-weight:700;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.now{transition:none}}
</style>

<div class="app">
  <header>
    <button id="pickBtn" class="wbtn" type="button"><span class="wname" id="wName">SST (MED)</span><span class="wmeta" id="wMeta">85分 · TSS 104 ▾</span></button>
    <label class="ftp" for="ftp">FTP <input id="ftp" type="number" inputmode="numeric" value="268" min="100" max="500"></label>
  </header>

  <section class="now" id="now">
    <div class="label"><b id="name">ウォームアップ</b><span id="idx">1 / 23</span></div>
    <div class="pw">
      <div><div class="cap">目標</div><div class="watts"><span id="watts">134</span><small>W</small></div></div>
      <div><div class="cap" id="liveCap">実測 3秒平均</div><div class="watts live" id="liveBox"><span id="live">---</span><small>W</small></div></div>
    </div>
    <div class="sub"><span id="pct">50% FTP</span>　<span id="cad"></span></div>
    <div class="laps">
      <div><span class="cap">ラップ平均</span><b id="lapAvg">---</b><small>W</small></div>
      <div><span class="cap">前ラップ</span><b id="prevLap">---</b><small>W</small><span class="prevTgt" id="prevTgt"></span></div>
    </div>
    <div class="clock" id="clock">10:00</div>
    <div class="bar"><i id="bar"></i></div>
  </section>

  <div class="next"><span>次: <b id="next">—</b></span><span id="nextW"></span></div>

  <div class="profile" id="profile"><div class="cursor" id="cursor"></div></div>
  <div class="total"><span>経過 <b id="elapsed">0:00</b></span><span>残り <b id="remain">85:00</b></span></div>

  <div class="bt">
    <div class="dev"><button id="pmBtn" type="button">パワーメーターを接続</button><span><i class="dot" id="pmDot"></i><span id="pmName">未接続</span></span></div>
    <div class="dev"><button id="trBtn" type="button">スマートトレーナーを接続</button><span><i class="dot" id="trDot"></i><span id="trName">未接続</span></span></div>
    <span class="alls">一覧に出ないとき：<button id="trAll" type="button" class="link">トレーナーを全機器から選ぶ</button><button id="pmAll" type="button" class="link">パワメを全機器から選ぶ</button></span>
    <button id="soundBtn" type="button">音テスト</button>
  </div>
  <div class="msg" id="btMsg" hidden></div>

  <div class="erg" id="ergBox" hidden>
    <div class="modes" role="radiogroup" aria-label="負荷モード">
      <button type="button" data-mode="off" class="on">フリー</button>
      <button type="button" data-mode="erg">ERG</button>
      <button type="button" data-mode="grade">斜度</button>
      <button type="button" data-mode="level">レベル</button>
    </div>
    <div class="ergrow">
      <div class="ergadj" id="adj" hidden>
        <button id="ergMinus" type="button" aria-label="下げる">−</button>
        <span id="ergVal">0W</span>
        <button id="ergPlus" type="button" aria-label="上げる">＋</button>
      </div>
      <span class="ergnow" id="ergNow">トレーナー負荷なし</span>
    </div>
  </div>


  <div class="done-msg" id="doneMsg" hidden>完走！お疲れさまでした</div>

  <div class="controls">
    <button id="back" type="button">◀ 戻る</button>
    <button id="toggle" class="go" type="button">スタート</button>
    <button id="skip" type="button">次へ ▶</button>
  </div>

  <section class="picker" id="picker" hidden aria-label="ワークアウトを選ぶ">
    <div class="pkhead">
      <input id="q" type="search" placeholder="名前で検索（例: SST, VO2, sprint）" autocomplete="off">
      <button id="pkClose" type="button">閉じる</button>
    </div>
    <div class="pkfilter" id="pkFilter">
      <button type="button" data-f="all" class="on">すべて</button>
      <button type="button" data-f="s">〜35分</button>
      <button type="button" data-f="m">36〜65分</button>
      <button type="button" data-f="l">66分〜</button>
    </div>
    <div class="pkcount" id="pkCount"></div>
    <ul class="pklist" id="pkList"></ul>
    <div class="detail" id="detail" hidden>
      <button id="dtBack" type="button" class="dtback">← 一覧に戻る</button>
      <h2 id="dtName"></h2>
      <div class="dtmeta" id="dtMeta"></div>
      <div class="dtprof" id="dtProf"></div>
      <div class="dtsec">
        <h3>強度の配分</h3>
        <div class="zbars" id="dtZones"></div>
      </div>
      <div class="dtsec">
        <h3>このワークアウトの中身</h3>
        <p class="dtsum" id="dtSum"></p>
      </div>
      <div class="dtsec">
        <h3>メニュー</h3>
        <ol class="dtsteps" id="dtSteps"></ol>
      </div>
      <a class="dtlink" id="dtLink" href="#" target="_blank" rel="noopener">すくみずログの解説記事を読む ↗</a>
      <div class="dtgo"><button id="dtGo" type="button" class="go">これをやる</button></div>
    </div>
  </section>

  <details class="list">
    <summary>メニュー全体</summary>
    <ol id="ol"></ol>
  </details>
</div>

function beep(freq=880,dur=0.15,when=0){
  if(!ac)return;
  if(ac.state!=="running")ac.resume();
  const t=ac.currentTime+0.02+when;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type="square";o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.5,t+0.01);
  g.gain.setValueAtTime(0.5,t+dur-0.03);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}

/* ---------- Bluetooth: power meter + smart trainer (separate links) ---------- */
// Live power/cadence: power meter wins whenever it has sent data in the last 3 s; trainer is the fallback.
const SRC={
  pm:{label:"パワメ",samples:[],last:0,cad:null,cadAt:0,crankPrev:null,dev:null},
  tr:{label:"トレーナー",samples:[],last:0,cad:null,cadAt:0,dev:null}
};
let live=null, liveSrc=null, cadence=null;
function pushPower(k,w){
  const s=SRC[k],now=performance.now();
  s.samples.push([now,w]);while(s.samples.length&&now-s.samples[0][0]>3000)s.samples.shift();
  s.last=now;s.inst=w;renderLive();
}
function setCad(k,c){SRC[k].cad=c;SRC[k].cadAt=performance.now();}
function onCPS(e){
  const s=SRC.pm,v=e.target.value;let f=v.getUint16(0,true),o=2;
  const p=v.getInt16(o,true);o+=2;
  if(f&0x01)o+=1; if(f&0x04)o+=2; if(f&0x10)o+=6;
  if(f&0x20&&v.byteLength>=o+4){
    const revs=v.getUint16(o,true),tm=v.getUint16(o+2,true),now=performance.now();
    const cp_=s.crankPrev;
    if(cp_){
      const dr=(revs-cp_[0]+65536)%65536,dt=((tm-cp_[1]+65536)%65536)/1024;
      if(dt>0&&dr>0){setCad("pm",Math.round(dr/dt*60));s.crankPrev=[revs,tm,now];}
      else if(dr===0&&now-cp_[2]>3000)setCad("pm",0);
    }else s.crankPrev=[revs,tm,now];
  }
  pushPower("pm",p);
}
function onFTMS(e){
  const v=e.target.value;const f=v.getUint16(0,true);let o=2;
  if(!(f&0x01))o+=2; if(f&0x02)o+=2;
  if(f&0x04){setCad("tr",Math.round(v.getUint16(o,true)/2));o+=2;}
  if(f&0x08)o+=2; if(f&0x10)o+=3; if(f&0x20)o+=2;
  if(f&0x40)pushPower("tr",v.getInt16(o,true));
}

let cp=null, hasControl=false, mode="off", sentKey=null, lastSend=0;

let q=Promise.resolve();
const gattQ=fn=>(q=q.then(fn,fn).catch(e=>{console.warn(e);}));
async function cpWrite(bytes){
  if(!cp)return;

}
const i16=v=>{v=Math.round(v);return [v&0xff,(v>>8)&0xff];};
async function takeControl(){
  if(!cp)return false;
  await cpWrite([0x00]);           // Request Control
  await cpWrite([0x07]);           // Start / Resume
  hasControl=true;sentKey=null;return true;
}
async function releaseControl(){
  if(!cp)return;

  hasControl=false;sentKey=null;
}
const ergTarget=()=>Math.max(0,Math.round((target+ergOffset)/5)*5);
function levelRaw(){
  const [mn,mx]=resRange||[0,100];

}
async function sendLoad(force){
  if(mode==="off"||!cp)return;
  if(!hasControl)await takeControl();
  let key,bytes;
  if(mode==="erg"&&!target)return;
  if(mode==="erg"){const w=ergTarget();key="e"+w;bytes=[0x05,...i16(w)];}                 // Set Target Power (W)

const STEP={erg:5,grade:0.5,level:5};
function adjust(dir){
  if(mode==="erg")ergOffset+=dir*STEP.erg;
  else if(mode==="grade")grade=Math.max(-10,Math.min(20,+(grade+dir*STEP.grade).toFixed(1)));
  else if(mode==="level")levelPct=Math.max(0,Math.min(100,levelPct+dir*STEP.level));
  renderLoad();sendLoad(true);
}
$("ergMinus").onclick=()=>adjust(-1);
$("ergPlus").onclick=()=>adjust(1);

async function connectTrainer(device){
  const server=await device.gatt.connect();
  cp=null;hasControl=false;
  const ftms=await server.getPrimaryService(U(0x1826));
  const c=await ftms.getCharacteristic(U(0x2AD2));c.addEventListener("characteristicvaluechanged",onFTMS);await c.startNotifications();
  try{
    cp=await ftms.getCharacteristic(U(0x2AD9));
    await cp.startNotifications();   // control point requires indications before writes
    try{const rr=await (await ftms.getCharacteristic(U(0x2AD6))).readValue();resRange=[rr.getInt16(0,true),rr.getInt16(2,true)];if(resRange[1]<=resRange[0])resRange=null;}catch(e){resRange=null;}
    if(mode!=="off"){await takeControl();await sendLoad(true);}
  }catch(e){cp=null;}
  renderLoad();
  return cp?"負荷制御可":"表示のみ";
}
async function connectPM(device){
  const server=await device.gatt.connect();
  SRC.pm.crankPrev=null;
  const s=await server.getPrimaryService(U(0x1818));const c=await s.getCharacteristic(U(0x2A63));
  c.addEventListener("characteristicvaluechanged",onCPS);await c.startNotifications();
  return "";
}
const LINK={
  pm:{btn:"pmBtn",dot:"pmDot",name:"pmName",title:"パワーメーター",service:U(0x1818),connect:connectPM},
  tr:{btn:"trBtn",dot:"trDot",name:"trName",title:"スマートトレーナー",service:U(0x1826),connect:connectTrainer}
};
function setLink(k,state,extra){
  const L=LINK[k],d=SRC[k].dev;
  $(L.dot).classList.toggle("on",state==="on");
  $(L.btn).textContent=state==="on"?`${L.title}を切断`:`${L.title}を接続`;
  $(L.name).textContent=state==="on"?`${d?.name||"接続済み"}${extra?"（"+extra+"）":""}`:state==="wait"?"接続中…":state==="retry"?"再接続中…":state==="lost"?"切断されました":"未接続";
}
async function linkDevice(k,showAll=false){
  unlockAudio();
  const L=LINK[k],S_=SRC[k];
  if(S_.dev&&S_.dev.gatt.connected){            // second tap = disconnect
    S_.manual=true;
    if(k==="tr"&&mode!=="off"){try{await releaseControl();}catch(e){}}
    S_.dev.gatt.disconnect();S_.dev=null;if(k==="tr"){cp=null;renderLoad();}setLink(k,"off");return;
  }
  if(!navigator.bluetooth){btMsg("このブラウザはBluetooth接続に対応していません。PC・AndroidのChrome / Edge、iPhoneならBluefyアプリでダウンロード版のHTMLを開いてください。");return;}
  try{
    const opt=[U(0x1818),U(0x1826)];
    const req=showAll?{acceptAllDevices:true,optionalServices:opt}
      :{filters:k==="tr"?[{services:[U(0x1826)]},{namePrefix:"GT"},{namePrefix:"GROWTAC"}]:[{services:[L.service]}],optionalServices:opt};
    const dev=await navigator.bluetooth.requestDevice(req);
    if(SRC[k==="pm"?"tr":"pm"].dev?.id===dev.id){btMsg(`同じ機器が${k==="pm"?"トレーナー":"パワーメーター"}側で接続済みです。別の機器を選んでください。`);return;}
    S_.dev=dev;S_.manual=false;setLink(k,"wait");
    const extra=await L.connect(dev);
    setLink(k,"on",extra);btMsg("");
    dev.addEventListener("gattserverdisconnected",async()=>{
      if(S_.manual||S_.dev!==dev)return;
      if(k==="tr"){cp=null;hasControl=false;renderLoad();}
      setLink(k,"retry");
      for(let i=0;i<5;i++){
        try{await new Promise(r=>setTimeout(r,1500));if(S_.dev!==dev)return;const x=await L.connect(dev);setLink(k,"on",x);return;}catch(e){}
      }
      setLink(k,"lost");
    });
  }catch(e){
    S_.dev=null;setLink(k,"off");
    const em=(e&&(e.message||e.name))||String(e);
    if(e&&e.name==="NotFoundError"&&/cancel/i.test(em))return;
    if((e&&e.name==="NotFoundError")||/no devices? found|not found/i.test(em)){btMsg(`${L.title}が見つかりませんでした。GT-eRemoteなど他のアプリを完全に終了してから、「一覧に出ないとき」で全機器を表示して選んでください。`);return;}
    if((e&&e.name==="SecurityError")||/permission|policy|disallowed/i.test(em))btMsg("このページ内ではBluetoothが使えません。ダウンロード版のHTMLファイルをChromeで開くと接続できます。");
    else btMsg(`${L.title}に接続できませんでした：${em}（Zwiftなど他のアプリと接続中だと使えないことがあります）`);
  }
}
$("pmBtn").onclick=()=>linkDevice("pm");
$("trBtn").onclick=()=>linkDevice("tr");
$("trAll").onclick=()=>linkDevice("tr",true);
$("pmAll").onclick=()=>linkDevice("pm",true);
function avg(s){return s.samples.length?Math.round(s.samples.reduce((a,x)=>a+x[1],0)/s.samples.length):null;}
function renderLive(){
  const now=performance.now();
  const pmFresh=now-SRC.pm.last<3000, trFresh=now-SRC.tr.last<3000;
  liveSrc=pmFresh?"pm":trFresh?"tr":null;
  live=liveSrc?avg(SRC[liveSrc]):null;
  const cadSrc=(SRC.pm.cad!==null&&now-SRC.pm.cadAt<4000)?"pm":(SRC.tr.cad!==null&&now-SRC.tr.cadAt<4000)?"tr":null;
  cadence=cadSrc?SRC[cadSrc].cad:null;
  $("live").textContent=live===null?"---":live;
  $("liveCap").textContent="実測 3秒平均"+(liveSrc?" · "+SRC[liveSrc].label:"");
  const b=$("liveBox");b.className="watts live";
  if(live!==null&&target){const r=live/target;b.classList.add(r<0.95?"low":r>1.05?"high":"ok");}
  $("cad").textContent=cadence!==null?`ケイデンス ${cadence} rpm`:"";
}

/* ---------- Timer ---------- */
let lastCount=-1;
function render(){
  const i=stepAt(Math.min(elapsed,TOTAL-0.001)), s=S[i], into=elapsed-starts[i], left=s[1]-into;
  const p=s[2]==null?null:s[2]+(s[3]-s[2])*Math.min(1,into/s[1]);
  const pr=p==null?0:Math.round(p); target=p==null?0:W(p);
  $("now").style.setProperty("--zc",`var(${zone(pr)})`);
  $("name").textContent=s[0];
  $("idx").textContent=`${i+1} / ${S.length}`;
  $("watts").textContent=p==null?"—":target;
  $("pct").textContent=(p==null?"フリーライド":s[2]===s[3]?`${Math.round(s[2])}% FTP`:`${pr}% FTP（${Math.round(s[2])}→${Math.round(s[3])}%）`)+(s[4]?`　目標 ${s[4]}rpm`:"");
  $("clock").textContent=fmt(left);
  $("bar").style.width=(into/s[1]*100)+"%";
  const n=S[i+1];$("next").textContent=n?n[0]:"終了";$("nextW").textContent=n?label(n):"";
  $("elapsed").textContent=fmt(elapsed);$("remain").textContent=fmt(TOTAL-elapsed);
  $("cursor").style.left=`calc(8px + (100% - 16px) * ${elapsed/TOTAL})`;
  if(i!==cur){
    document.querySelectorAll(".seg").forEach((d,k)=>d.className="seg"+(k<i?" done":k===i?" cur":""));
    document.querySelectorAll("#ol li").forEach((d,k)=>d.className=k===i?"cur":"");
    if(cur!==-1&&running)stepChime();
    if(cur!==-1){if(lapT>=5){prevLapW=Math.round(lapE/lapT);prevLapTgt=Math.round(lapTgtE/lapT);}lapE=lapT=lapTgtE=0;}
    cur=i;
  }
  const c=Math.ceil(left);
  if(running&&c<=3&&c>=1&&c!==lastCount)beep(880,0.12);
  lastCount=c;
  renderLive();renderLap();
  if(mode==="erg"&&cp){renderLoad();sendLoad(false);}
}
let lapE=0,lapT=0,lapTgtE=0,prevLapW=null,prevLapTgt=null;
function lapClass(w,t){if(w===null||!t)return "";const r=w/t;return r<0.95?"low":r>1.05?"high":"ok";}
function renderLap(){
  const a=lapT>0?Math.round(lapE/lapT):null, tg=lapT>0?Math.round(lapTgtE/lapT):target;
  $("lapAvg").textContent=a===null?"---":a;$("lapAvg").className=lapClass(a,tg);
  $("prevLap").textContent=prevLapW===null?"---":prevLapW;$("prevLap").className=lapClass(prevLapW,prevLapTgt);
  $("prevTgt").textContent=prevLapTgt?`目標 ${prevLapTgt}W`:"";
}
function tick(){
  if(!running)return;
  const now=performance.now(),dt=(now-last)/1000;elapsed+=dt;last=now;
  if(liveSrc&&SRC[liveSrc].inst!=null&&dt<2){lapE+=SRC[liveSrc].inst*dt;lapT+=dt;lapTgtE+=target*dt;}
  if(elapsed>=TOTAL){elapsed=TOTAL;render();stop();$("doneMsg").hidden=false;$("toggle").textContent="リセット";beep(660,0.6);return;}
  render();
}
async function start(){
  unlockAudio();
  if(elapsed>=TOTAL){elapsed=0;cur=-1;$("doneMsg").hidden=true;}
  try{wake=await navigator.wakeLock?.request("screen");}catch(e){}
  running=true;last=performance.now();$("toggle").textContent="一時停止";
  clearInterval(timer);timer=setInterval(tick,200);
}
function stop(){running=false;clearInterval(timer);$("toggle").textContent="再開";try{wake?.release();}catch(e){}wake=null;}
$("toggle").onclick=()=>running?stop():start();
$("skip").onclick=()=>{unlockAudio();const i=stepAt(elapsed);elapsed=i+1<S.length?starts[i+1]:TOTAL-0.5;render();};
$("back").onclick=()=>{unlockAudio();const i=stepAt(elapsed);elapsed=(elapsed-starts[i]>3||i===0)?starts[i]:starts[i-1];render();};
$("ftp").oninput=e=>{const v=+e.target.value;if(v>=100&&v<=500){ftp=v;try{localStorage.setItem("ftp",v);}catch(e){}setWorkout(W_CUR);build();cur=-1;render();}};
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){if(ac&&ac.state!=="running")ac.resume();if(running){try{wake=await navigator.wakeLock?.request("screen");}catch(e){}}}});
setInterval(renderLive,1000);
/* ---------- Workout picker ---------- */
let pkF="all";
function miniProfile(w){
  const st=w.steps.map(x=>x[4]?[x[0],x[1]/ftp*100,x[2]/ftp*100]:x);const tot=st.reduce((a,x)=>a+x[0],0),mx=Math.max(115,...st.map(x=>Math.max(x[1]||0,x[2]||0)));
  return st.map(x=>{const p=x[1]==null?40:Math.max(x[1],x[2]);return `<i style="width:${x[0]/tot*100}%;height:${Math.min(100,p/mx*100)}%;background:var(${zone(p)})"></i>`;}).join("");
}
function renderPicker(){
  const q=$("q").value.trim().toLowerCase();
  const list=WORKOUTS.filter(w=>(!q||w.name.toLowerCase().includes(q))&&(pkF==="all"||(pkF==="s"&&w.min<=35)||(pkF==="m"&&w.min>35&&w.min<=65)||(pkF==="l"&&w.min>65)));
  $("pkCount").textContent=`${list.length} / ${WORKOUTS.length} 本`;
  $("pkList").innerHTML=list.map(w=>`<li><button type="button" data-id="${w.id}" class="${w===W_CUR?"cur":""}"><span class="pkn"></span><span class="pkm">${w.min}分 · TSS ${w.tss||"—"}</span><span class="mini">${miniProfile(w)}</span></button></li>`).join("");
  $("pkList").querySelectorAll(".pkn").forEach((el,i)=>el.textContent=list[i].name);
}
$("pickBtn").onclick=()=>{$("picker").hidden=false;renderPicker();$("q").focus();};
$("pkClose").onclick=()=>{$("detail").hidden=true;$("picker").hidden=true;};
$("q").oninput=renderPicker;
$("pkFilter").onclick=e=>{const b=e.target.closest("button");if(!b)return;pkF=b.dataset.f;$("pkFilter").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));renderPicker();};
let dtW=null;
const ZN=[["リカバリー","--z1",0,60],["エンデュランス","--z2",60,76],["テンポ","--z3",76,90],["閾値（SST〜FTP）","--z4",90,105],["VO2max","--z5",105,119],["無酸素・スプリント","--z6",119,999]];
const stPct=st=>st[1]==null?null:(st[4]?[st[1]/ftp*100,st[2]/ftp*100]:[st[1],st[2]]);
const fmtD=sec=>{const m=Math.floor(sec/60),s=sec%60;return m?(s?`${m}分${s}秒`:`${m}分`):`${s}秒`;};
function stepText(st){
  const pc=stPct(st); let t=fmtD(st[0])+" ";
  if(!pc)t+="フリーライド";
  else if(st[4])t+=st[1]===st[2]?`${st[1]}W`:`${st[1]}→${st[2]}W`;
  else t+=st[1]===st[2]?`${st[1]}%（${W(st[1])}W）`:`${st[1]}→${st[2]}%（${W(st[1])}→${W(st[2])}W）`;
  if(st[3])t+=` · ${st[3]}rpm`;
  return t;
}
// collapse repeated sequences: [{n, items:[steps]}]
function groupSteps(steps){
  const key=st=>st.join(",");const out=[];let i=0;
  while(i<steps.length){
    let best={n:1,k:1};
    for(let k=1;k<=4&&i+k<=steps.length;k++){
      let n=1;while(i+(n+1)*k<=steps.length&&steps.slice(i+n*k,i+(n+1)*k).every((x,j)=>key(x)===key(steps[i+j])))n++;
      if(n>1&&n*k>best.n*best.k)best={n,k};
    }
    out.push({n:best.n,items:steps.slice(i,i+best.k)});i+=best.n*best.k;
  }
  return out;
}
function summary(w){
  const tot=w.steps.reduce((a,x)=>a+x[0],0),z=zoneSecs(w);
  const hard=z[3]+z[4]+z[5];
  const main=ZN.map((n,i)=>[n[0],z[i]]).filter((x,i)=>i>=2).sort((a,b)=>b[1]-a[1])[0];
  const g=groupSteps(w.steps).filter(x=>x.n>1&&x.items.some(st=>{const p=stPct(st);return p&&Math.max(...p)>=90;}));
  let s=`合計${Math.round(tot/60)}分のうち、閾値以上（FTPの90%〜）で踏むのは約${Math.round(hard/60)}分。`;
  if(main&&main[1]>0)s+=`いちばん長いのは「${main[0]}」の約${Math.round(main[1]/60)}分です。`;
  if(g.length){const x=g.sort((a,b)=>b.n*b.items.length-a.n*a.items.length)[0];s+=`中心になるのは「${x.items.map(stepText).join(" ＋ ")}」を${x.n}回繰り返すセット。`;}
  const peak=Math.max(...w.steps.map(st=>{const p=stPct(st);return p?Math.max(...p):0;}));
  if(peak>=119)s+=`最大で${Math.round(peak)}%（${W(peak)}W）の短い全力区間があります。`;
  const cad=w.steps.filter(st=>st[3]);if(cad.length)s+=`ケイデンス指定のある区間が${cad.length}か所あります。`;
  return s;
}
function zoneSecs(w){
  const z=[0,0,0,0,0,0];
  for(const st of w.steps){const p=stPct(st);const v=p?(p[0]+p[1])/2:0;const i=ZN.findIndex(n=>v>=n[2]&&v<n[3]);z[i<0?0:i]+=st[0];}
  return z;
}
function openDetail(w){
  dtW=w;
  $("dtName").textContent=w.name;
  $("dtMeta").innerHTML=`<span><b>${w.min}</b>分</span><span><b>${w.tss||"—"}</b>TSS</span><span><b>${w.steps.length}</b>ステップ</span>`;
  $("dtProf").innerHTML=miniProfile(w);
  const z=zoneSecs(w),tot=z.reduce((a,b)=>a+b,0);
  $("dtZones").innerHTML=ZN.map((n,i)=>`<div class="zrow"><span>${n[0]}</span><span class="zt"><i style="width:${z[i]/tot*100}%;background:var(${n[1]})"></i></span><span>${z[i]?fmtD(Math.max(60,Math.round(z[i]/60)*60)):"—"}</span></div>`).join("");
  $("dtSum").textContent=summary(w);
  $("dtSteps").innerHTML=groupSteps(w.steps).map(g=>g.n>1?`<li><span class="rep">${g.n}回</span>　${g.items.map(stepText).join(" → ")}</li>`:`<li>${stepText(g.items[0])}</li>`).join("");
  $("dtLink").href=w.url;
  $("detail").hidden=false;$("detail").scrollTop=0;
}
$("dtBack").onclick=()=>{$("detail").hidden=true;};
$("pkList").onclick=e=>{
  const b=e.target.closest("button[data-id]");if(!b)return;
  const w=WORKOUTS.find(x=>x.id===b.dataset.id);if(w)openDetail(w);
};
$("dtGo").onclick=()=>{
  const w=dtW;if(!w)return;
  if(running)stop();
  setWorkout(w);try{localStorage.setItem("wid",w.id);}catch(e){}
  elapsed=0;cur=-1;lapE=lapT=lapTgtE=0;prevLapW=prevLapTgt=null;$("doneMsg").hidden=true;$("toggle").textContent="スタート";
  build();render();$("detail").hidden=true;$("picker").hidden=true;
};
{let wid=null;try{wid=localStorage.getItem("wid");}catch(e){}
 setWorkout(WORKOUTS.find(w=>w.id===wid)||WORKOUTS.find(w=>w.id==="sstmed")||WORKOUTS[0]);}
build();render();
</script>
